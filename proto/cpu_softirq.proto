syntax = "proto3";
package monitor.proto;

// Worker 按 CPU 核上报的 SoftIRQ 速率视图；所有字段单位为 events/s，
// cpu 标识保留逐核维度。
message SoftIrq {
    string cpu = 1;
    float hi = 2;
    float timer = 3;
    float net_tx = 4;
    float net_rx = 5;
    float block = 6;
    float irq_poll = 7;
    float tasklet = 8;
    float sched = 9;
    float hrtimer = 10;
    float rcu = 11;
    bool sample_valid = 20;
  }
