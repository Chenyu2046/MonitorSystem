syntax = "proto3";
package monitor.proto;

// Worker 自适应监控状态；状态转换由连续异常/恢复样本和 profiling/cooldown
// 时间窗口驱动，不代表单次指标的直接分类。
enum ObservabilityState {
  OBSERVABILITY_NORMAL = 0;
  OBSERVABILITY_SUSPECT = 1;
  OBSERVABILITY_DIAGNOSTIC = 2;
  OBSERVABILITY_PROFILING = 3;
  OBSERVABILITY_COOLDOWN = 4;
}

enum DiagnosticDomain {
  DOMAIN_UNKNOWN = 0;
  DOMAIN_CPU = 1;
  DOMAIN_MEMORY = 2;
  DOMAIN_DISK = 3;
  DOMAIN_NETWORK = 4;
  DOMAIN_SCHEDULER = 5;
}

// 一条基础指标或 Probe evidence 的原始值、单位、目标和 0~1 分数。
message DiagnosticSignal {
  DiagnosticDomain domain = 1;
  string metric = 2;
  double value = 3;
  string unit = 4;
  double anomaly_score = 5;
  string target = 6;
}

message StackFrame {
  uint64 address = 1;
  string symbol = 2;
  string module = 3;
}

// OnCPU/OffCPU top-N 栈样本；samples 是采样次数，不是精确 CPU 百分比。
message ProfileEntry {
  int32 pid = 1;
  int32 tid = 2;
  uint64 samples = 3;
  uint64 total_offcpu_ns = 4;
  repeated StackFrame user_stack = 5;
  repeated StackFrame kernel_stack = 6;
  int32 user_stack_id = 7;
  int32 kernel_stack_id = 8;
}

// Probe 的策略请求与实际 available/attached 状态，便于表达降级能力。
message ProbeRuntimeStatus {
  string probe = 1;
  bool requested = 2;
  bool available = 3;
  bool attached = 4;
  int32 last_error = 5;
}

// Worker 一轮异常信号、Probe 状态和 profiling 快照的统一载体。
message DiagnosticSnapshot {
  ObservabilityState state = 1;
  double anomaly_score = 2;
  repeated DiagnosticSignal signals = 3;
  repeated ProfileEntry oncpu_profiles = 4;
  repeated ProfileEntry offcpu_profiles = 5;
  repeated ProbeRuntimeStatus probe_status = 6;
}

// Manager 规则诊断使用的可追溯证据，source/target 指向原始数据边界。
message Evidence {
  string id = 1;
  string type = 2;
  string source = 3;
  string target = 4;
  double value = 5;
  string unit = 6;
  double severity = 7;
  int64 timestamp_ms = 8;
  string detail = 9;
}

// Manager RootCauseEngine 规则组合结果及其 evidence_ids 关联。
message RootCause {
  string type = 1;
  double confidence = 2;
  repeated string evidence_ids = 3;
  string summary = 4;
}

// 一次主机异常 episode 的 active 状态、根因和证据快照。
message Incident {
  uint64 id = 1;
  string server_name = 2;
  string severity = 3;
  string state = 4;
  int64 start_time_ms = 5;
  int64 end_time_ms = 6;
  repeated RootCause root_causes = 7;
  repeated Evidence evidence = 8;
  bool active = 9;
}
