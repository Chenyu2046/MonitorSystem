syntax = "proto3";
package monitor.proto;

// Worker 逐核 CPU 百分比样本。Manager 普通概览会对有效核求平均，
// 异常路径仍可使用逐核最大值。
message CpuStat{
    string cpu_name = 1;
    float cpu_percent = 2;
    float usr_percent = 3;
    float system_percent = 4;
    float nice_percent = 5;
    float idle_percent = 6;
    float io_wait_percent = 7;
    float irq_percent = 8;
    float soft_irq_percent = 9;
    // Additive presence marker: true only when this complete sample was read.
    bool sample_valid = 20;
  }
