syntax = "proto3";
package monitor.proto;

// Manager 查询 API：客户端 request -> QueryService -> MySQL 或内存 fallback
// -> response。分页字段只影响查询视图，不改变实时采集/诊断状态。

import "google/protobuf/timestamp.proto";
import "diagnostic.proto";

// ========== 基础类型 ==========

// 历史查询的起止时间。
message TimeRange {
    google.protobuf.Timestamp start_time = 1;
    google.protobuf.Timestamp end_time = 2;
}

// 分页参数，page 从 1 开始，page_size 缺省时由服务端补默认值。
message Pagination {
    int32 page = 1;      // 页码，从1开始
    int32 page_size = 2; // 每页大小，默认100
}

// 排序方式
enum SortOrder {
    DESC = 0;  // 降序（默认）
    ASC = 1;   // 升序
}

// Rank 默认保持旧 resource score 语义；新客户端可显式按 health 排序。
enum ScoreKind {
    RESOURCE_SCORE = 0;
    HEALTH_SCORE = 1;
}

// 服务器状态
enum ServerStatus {
    ONLINE = 0;
    OFFLINE = 1;
}

// ========== 请求消息 ==========

// 时间段性能数据查询请求
message QueryPerformanceRequest {
    string server_name = 1;
    TimeRange time_range = 2;
    Pagination pagination = 3;
}

// 变化率趋势查询请求
message QueryTrendRequest {
    string server_name = 1;
    TimeRange time_range = 2;
    int32 interval_seconds = 3;  // 聚合间隔（秒），0表示不聚合
}

// 异常查询请求
message QueryAnomalyRequest {
    string server_name = 1;       // 可选，空表示查询所有服务器
    TimeRange time_range = 2;
    float cpu_threshold = 3;      // CPU使用率阈值，默认80
    float mem_threshold = 4;      // 内存使用率阈值，默认90
    float disk_threshold = 5;     // 磁盘利用率阈值，默认85
    float change_rate_threshold = 6;  // 变化率阈值，默认0.5（50%）
    Pagination pagination = 7;
}

// 评分排序查询请求
message QueryScoreRankRequest {
    SortOrder order = 1;
    Pagination pagination = 2;
    ScoreKind score_kind = 3;
}

// 最新评分查询请求
message QueryLatestScoreRequest {
    // 无参数，返回所有服务器最新数据
}

// 详细数据查询请求
message QueryDetailRequest {
    string server_name = 1;
    TimeRange time_range = 2;
    Pagination pagination = 3;
}

message GetIncidentsRequest {
    string server_name = 1;
    TimeRange time_range = 2;
    string root_cause = 3;
    string severity = 4;
    Pagination pagination = 5;
}

message GetIncidentsResponse {
    repeated Incident incidents = 1;
    int32 total_count = 2;
    int32 page = 3;
    int32 page_size = 4;
}

message GetIncidentDetailRequest {
    uint64 incident_id = 1;
}

message GetIncidentDetailResponse {
    Incident incident = 1;
}

message GetActiveDiagnosisRequest {
    string server_name = 1;
}

message GetActiveDiagnosisResponse {
    repeated Incident incidents = 1;
}

// ========== 数据记录 ==========

message HealthTopSignal {
    string metric = 1;
    double value = 2;
    bool threshold_available = 3;
    double threshold_score = 4;
    double mad_score = 5;
    double ewma_score = 6;
    int32 anomaly_votes = 7;
    double anomaly_score = 8;
    bool anomalous = 9;
    string model_state = 10;
}

// 主表性能快照，普通值和变化率字段共存。
message PerformanceRecord {
    string server_name = 1;
    google.protobuf.Timestamp timestamp = 2;
    // CPU 主机概览：有效 CPU 核对应字段的平均值，单位 percent。
    float cpu_percent = 10;
    float usr_percent = 11;
    float system_percent = 12;
    float nice_percent = 13;
    float idle_percent = 14;
    float io_wait_percent = 15;
    float irq_percent = 16;
    float soft_irq_percent = 17;
    // Load Average：1/5/15 分钟窗口；load_avg_3 是历史字段名，实际为 5 分钟。
    float load_avg_1 = 20;
    float load_avg_3 = 21;
    float load_avg_15 = 22;
    // 内存主机概览：使用率单位 percent，容量单位 GiB。
    float mem_used_percent = 30;
    float mem_total = 31;
    float mem_free = 32;
    float mem_avail = 33;
    // 磁盘主机概览：当前有效磁盘中的最大 util，单位 percent。
    float disk_util_percent = 40;
    // 网络主机概览：所有有效网卡速率之和，单位 KiB/s。
    float send_rate = 50;
    float rcv_rate = 51;
    // 兼容字段，继续表示资源余量分数，不是健康分数，范围通常为 0~100。
    float score = 60;
    // 相对变化率：(当前值 - 上一值) / 上一值；无上一有效样本时通常为 0。
    float cpu_percent_rate = 70;
    float usr_percent_rate = 71;
    float system_percent_rate = 72;
    float io_wait_percent_rate = 73;
    float load_avg_1_rate = 74;
    float load_avg_3_rate = 75;
    float load_avg_15_rate = 76;
    float mem_used_percent_rate = 77;
    float disk_util_percent_rate = 78;
    float send_rate_rate = 79;
    float rcv_rate_rate = 80;
    // 自适应健康评分字段只追加新 tag；score 继续表示 resource score。
    float health_score = 90;
    float resource_score = 91;
    float anomaly_score = 92;
    float anomaly_rate_5m = 93;
    float confidence = 94;
    string state = 95;
    bool health_valid = 96;
    string model_state = 97;
    repeated HealthTopSignal top_signals = 98;
}

// 基于历史阈值筛选得到的异常记录。
message AnomalyRecord {
    string server_name = 1;
    google.protobuf.Timestamp timestamp = 2;
    string anomaly_type = 3;      // CPU_HIGH, MEM_HIGH, DISK_HIGH, RATE_SPIKE
    string severity = 4;          // WARNING, CRITICAL
    float value = 5;              // 异常值
    float threshold = 6;          // 阈值
    string metric_name = 7;       // 指标名称
}

// 单服务器最新评分和关键主机指标摘要。
message ServerScoreSummary {
    string server_name = 1;
    // 兼容字段，表示资源余量分数。
    float score = 2;
    google.protobuf.Timestamp last_update = 3;
    ServerStatus status = 4;
    // 关键主机指标快照：CPU、内存和磁盘利用率为 percent，Load 为任务负载值。
    float cpu_percent = 10;
    float mem_used_percent = 11;
    float disk_util_percent = 12;
    float load_avg_1 = 13;
    float health_score = 20;
    float resource_score = 21;
    float anomaly_score = 22;
    float anomaly_rate_5m = 23;
    float confidence = 24;
    string state = 25;
    bool health_valid = 26;
    string model_state = 27;
    repeated HealthTopSignal top_signals = 28;
}

// 最新评分查询的集群级聚合统计。
message ClusterStats {
    int32 total_servers = 1;
    int32 online_servers = 2;
    int32 offline_servers = 3;
    float avg_score = 4;
    float max_score = 5;
    float min_score = 6;
    string best_server = 7;
    string worst_server = 8;
    float avg_health_score = 20;
    float max_health_score = 21;
    float min_health_score = 22;
    string healthiest_server = 23;
    string least_healthy_server = 24;
}


// ========== 响应消息 ==========

// 时间段性能数据查询响应
message QueryPerformanceResponse {
    repeated PerformanceRecord records = 1;
    int32 total_count = 2;
    int32 page = 3;
    int32 page_size = 4;
}

// 变化率趋势查询响应
message QueryTrendResponse {
    repeated PerformanceRecord records = 1;
    int32 interval_seconds = 2;
}

// 异常查询响应
message QueryAnomalyResponse {
    repeated AnomalyRecord anomalies = 1;
    int32 total_count = 2;
    int32 page = 3;
    int32 page_size = 4;
}

// 评分排序查询响应
message QueryScoreRankResponse {
    repeated ServerScoreSummary servers = 1;
    int32 total_count = 2;
    int32 page = 3;
    int32 page_size = 4;
}

// 最新评分查询响应
message QueryLatestScoreResponse {
    repeated ServerScoreSummary servers = 1;
    ClusterStats cluster_stats = 2;
}

// ========== 详细数据记录 ==========

// 单网卡历史 detail 记录。
message NetDetailRecord {
    string server_name = 1;
    string net_name = 2;
    google.protobuf.Timestamp timestamp = 3;
    // 以下错误/丢弃值为单网卡累计计数。
    uint64 err_in = 10;
    uint64 err_out = 11;
    uint64 drop_in = 12;
    uint64 drop_out = 13;
    // 单网卡速率指标；字节速率单位 KiB/s，包速率单位 packets/s。
    float rcv_bytes_rate = 20;
    float snd_bytes_rate = 21;
    float rcv_packets_rate = 22;
    float snd_packets_rate = 23;
    // 单网卡指标的相对变化率；错误/丢弃速率由 Manager 对累计计数做差分得到。
    float rcv_bytes_rate_rate = 30;
    float snd_bytes_rate_rate = 31;
    float err_in_rate = 32;
    float err_out_rate = 33;
    float drop_in_rate = 34;
    float drop_out_rate = 35;
}

// 单磁盘历史 detail 记录。
message DiskDetailRecord {
    string server_name = 1;
    string disk_name = 2;
    google.protobuf.Timestamp timestamp = 3;
    // 单磁盘性能指标：吞吐 bytes/s，IOPS requests/s，延迟 ms/request，util percent。
    float read_bytes_per_sec = 10;
    float write_bytes_per_sec = 11;
    float read_iops = 12;
    float write_iops = 13;
    float avg_read_latency_ms = 14;
    float avg_write_latency_ms = 15;
    float util_percent = 16;
    // 单磁盘派生指标的相对变化率。
    float read_bytes_per_sec_rate = 20;
    float write_bytes_per_sec_rate = 21;
    float read_iops_rate = 22;
    float write_iops_rate = 23;
    float util_percent_rate = 24;
}

// 主机内存分类历史 detail 记录。
message MemDetailRecord {
    string server_name = 1;
    google.protobuf.Timestamp timestamp = 2;
    // 主机内存分类指标，容量单位 GiB；used_percent 不在该 detail 消息中。
    float total = 10;
    float free = 11;
    float avail = 12;
    float buffers = 13;
    float cached = 14;
    float swap_cached = 15;
    float active = 16;
    float inactive = 17;
    float active_anon = 18;
    float inactive_anon = 19;
    float active_file = 20;
    float inactive_file = 21;
    float dirty = 22;
    float writeback = 23;
    float anon_pages = 24;
    float mapped = 25;
    // 内存分类容量的相对变化率。
    float total_rate = 30;
    float free_rate = 31;
    float avail_rate = 32;
    float active_rate = 33;
    float inactive_rate = 34;
}

// 单 CPU 核 SoftIRQ 历史 detail 记录。
message SoftIrqDetailRecord {
    string server_name = 1;
    string cpu_name = 2;
    google.protobuf.Timestamp timestamp = 3;
    // 仅保留 tag 以维持 wire compatibility；服务端不再填充这些累计字段。
    int64 hi = 10 [deprecated = true];
    int64 timer = 11 [deprecated = true];
    int64 net_tx = 12 [deprecated = true];
    int64 net_rx = 13 [deprecated = true];
    int64 block = 14 [deprecated = true];
    int64 irq_poll = 15 [deprecated = true];
    int64 tasklet = 16 [deprecated = true];
    int64 sched = 17 [deprecated = true];
    int64 hrtimer = 18 [deprecated = true];
    int64 rcu = 19 [deprecated = true];
    // SoftIRQ 速率的相对变化率；当前 worker 输出的单位是 events/s。
    float hi_rate = 20;
    float timer_rate = 21;
    float net_tx_rate = 22;
    float net_rx_rate = 23;
    float block_rate = 24;
    float sched_rate = 25;
    // 当前 worker 输出的 SoftIRQ 事件速率，单位 events/s。
    float hi_per_sec = 30;
    float timer_per_sec = 31;
    float net_tx_per_sec = 32;
    float net_rx_per_sec = 33;
    float block_per_sec = 34;
    float irq_poll_per_sec = 35;
    float tasklet_per_sec = 36;
    float sched_per_sec = 37;
    float hrtimer_per_sec = 38;
    float rcu_per_sec = 39;
}

// ========== 详细数据查询响应 ==========

message QueryNetDetailResponse {
    repeated NetDetailRecord records = 1;
    int32 total_count = 2;
    int32 page = 3;
    int32 page_size = 4;
}

message QueryDiskDetailResponse {
    repeated DiskDetailRecord records = 1;
    int32 total_count = 2;
    int32 page = 3;
    int32 page_size = 4;
}

message QueryMemDetailResponse {
    repeated MemDetailRecord records = 1;
    int32 total_count = 2;
    int32 page = 3;
    int32 page_size = 4;
}

message QuerySoftIrqDetailResponse {
    repeated SoftIrqDetailRecord records = 1;
    int32 total_count = 2;
    int32 page = 3;
    int32 page_size = 4;
}

// ========== 查询服务定义 ==========

// QueryService 将历史性能、详细资源和 incident 视图暴露为 gRPC RPC。
service QueryService {
    // 时间段性能数据查询
    rpc QueryPerformance(QueryPerformanceRequest) returns (QueryPerformanceResponse);
    
    // 变化率趋势查询
    rpc QueryTrend(QueryTrendRequest) returns (QueryTrendResponse);
    
    // 异常数据查询
    rpc QueryAnomaly(QueryAnomalyRequest) returns (QueryAnomalyResponse);
    
    // 评分排序查询
    rpc QueryScoreRank(QueryScoreRankRequest) returns (QueryScoreRankResponse);
    
    // 最新评分查询
    rpc QueryLatestScore(QueryLatestScoreRequest) returns (QueryLatestScoreResponse);
    
    // 详细数据查询
    rpc QueryNetDetail(QueryDetailRequest) returns (QueryNetDetailResponse);
    rpc QueryDiskDetail(QueryDetailRequest) returns (QueryDiskDetailResponse);
    rpc QueryMemDetail(QueryDetailRequest) returns (QueryMemDetailResponse);
    rpc QuerySoftIrqDetail(QueryDetailRequest) returns (QuerySoftIrqDetailResponse);
    rpc GetIncidents(GetIncidentsRequest) returns (GetIncidentsResponse);
    rpc GetIncidentDetail(GetIncidentDetailRequest) returns (GetIncidentDetailResponse);
    rpc GetActiveDiagnosis(GetActiveDiagnosisRequest) returns (GetActiveDiagnosisResponse);
}
