name: Profile README polish (one-shot)

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/profile-readme-once.yml

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Insert engineering snapshot
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path("README.md")
          text = p.read_text(encoding="utf-8")
          start = "<!-- profile-intro:start -->"
          end = "<!-- profile-intro:end -->"
          block = """<!-- profile-intro:start -->

> **工程概览** — 面向多机 Linux 环境的分布式性能监控系统，以 C++17 构建 Worker / Manager 数据链路，通过 eBPF 与内核模块采集系统指标，并使用 gRPC Push、MySQL 持久化和查询接口形成从采集、传输到分析的完整闭环。

**Engineering Highlights**
- **Low-overhead telemetry**：结合 eBPF / 内核模块采集 CPU、内存、磁盘、网络与软中断等运行指标。
- **Distributed pipeline**：Worker 主动通过 gRPC 推送监控数据，Manager 统一接收、计算健康评分并持久化。
- **Queryable observability**：提供历史数据、趋势分析与异常查询能力，把实时采集扩展为可追溯的观测系统。
- **Systems focus**：覆盖 Linux 内核态/用户态协作、RPC 通信、并发处理和服务端工程化。

`C++17` · `Linux` · `eBPF` · `Kernel Module` · `gRPC` · `Protobuf` · `MySQL` · `CMake`

<!-- profile-intro:end -->"""

          if start in text and end in text:
              a = text.index(start)
              b = text.index(end, a) + len(end)
              text = text[:a] + block + text[b:]
          else:
              lines = text.splitlines(keepends=True)
              idx = next((i + 1 for i, line in enumerate(lines) if line.startswith("# ")), 0)
              lines.insert(idx, "\n" + block + "\n\n")
              text = "".join(lines)

          p.write_text(text, encoding="utf-8")
          PY

      - name: Commit README and cleanup
        shell: bash
        run: |
          rm -f .github/profile-description.txt .github/workflows/profile-readme-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: polish project introduction"
          git push origin main
