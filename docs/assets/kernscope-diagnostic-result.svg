    .e{font:600 17px JetBrains Mono,Consolas,monospace;fill:#e2e8f0}
    .muted{font:500 15px JetBrains Mono,Consolas,monospace;fill:#94a3b8}
  </style>
</defs>
<rect width="1600" height="900" rx="26" fill="url(#dbg)"/>
